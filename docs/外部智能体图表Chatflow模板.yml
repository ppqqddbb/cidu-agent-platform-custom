        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: 请输入你的查询需求，例如：查询全部项目信息，并根据项目状态生成柱状图。
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
    - 查询全部项目信息，并根据项目状态生成柱状图
    - 统计最近 7 天销售额并生成柱状图
    - 统计各产品销量占比并生成饼图
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
