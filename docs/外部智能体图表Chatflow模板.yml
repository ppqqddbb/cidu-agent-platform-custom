          def _strip_fence(text: str) -> str:
              stripped = text.strip()
              match = re.match(r"^```[a-zA-Z0-9_-]*\s*(.*?)\s*```$", stripped, re.S)
              if match:
                  return match.group(1).strip()
              return stripped


          def _try_load_json(value: Any) -> Tuple[Any, bool]:
              if isinstance(value, (dict, list)):
                  return value, True
              if not isinstance(value, str):
                  return value, False

              text = _strip_fence(value)
              if not text:
                  return value, False

              # Handle strings like: "tool response: {...}"
              prefix_match = re.match(r"^\s*tool response:\s*(.+?)\s*\.?\s*$", text, re.S | re.I)
              if prefix_match:
                  text = prefix_match.group(1).strip()

              try:
                  return json.loads(text), True
              except Exception:
                  decoder = json.JSONDecoder()
                  for match in re.finditer(r"[\{\[]", text):
                      start = match.start()
                      try:
                          parsed, end = decoder.raw_decode(text[start:])
                      except Exception:
                          continue

                      suffix = text[start + end:].strip()
                      if not suffix or suffix in {".", "。"}:
                          return parsed, True

                  return value, False


          def _is_scalar(value: Any) -> bool:
              return value is None or isinstance(value, (str, int, float, bool))


          def _looks_like_log_row(row: Any) -> bool:
              if not isinstance(row, dict):
                  return False

              keys = set(row.keys())
              if keys and keys.issubset(LOG_ROW_KEYS | {"data"}):
                  return True

              label = row.get("label")
              if isinstance(label, str) and any(hint in label.upper() for hint in LOG_LABEL_HINTS):
                  return True

              row_id = row.get("id")
              node_id = row.get("node_id")
              status = row.get("status")
              if isinstance(row_id, str) and isinstance(node_id, str) and isinstance(status, str):
                  return True

              data = row.get("data")
              if isinstance(data, dict) and any(key in data for key in ("tool_input", "tool_name", "tool_call_id", "tool_response")):
                  return True

              return False


          def _looks_like_api_catalog_row(row: Any) -> bool:
              if not isinstance(row, dict):
                  return False

              keys = set(row.keys())
              if "api_id" in keys and "api_name" in keys:
                  return True
              if len(keys & API_CATALOG_KEYS) >= 3:
                  return True
              return False


          def _looks_like_business_rows(rows: list[Any]) -> bool:
              dict_rows = [row for row in rows if isinstance(row, dict)]
              if not dict_rows:
                  return False

              log_like = sum(1 for row in dict_rows if _looks_like_log_row(row))
              api_catalog_like = sum(1 for row in dict_rows if _looks_like_api_catalog_row(row))
              if log_like == len(dict_rows) or api_catalog_like == len(dict_rows):
                  return False

              max_scalar_columns = 0
              for row in dict_rows[:5]:
                  if _looks_like_log_row(row) or _looks_like_api_catalog_row(row):
                      continue
                  scalar_count = sum(1 for value in row.values() if _is_scalar(value))
                  max_scalar_columns = max(max_scalar_columns, scalar_count)

              return max_scalar_columns >= 2


          def _extract_invoke_api_payloads(value: Any, depth: int = 0) -> list[Any]:
              if depth > 8 or value in (None, ""):
                  return []

              payloads: list[Any] = []
              parsed, parsed_ok = _try_load_json(value)
              if parsed_ok and parsed is not value:
                  payloads.extend(_extract_invoke_api_payloads(parsed, depth + 1))
                  value = parsed

              if isinstance(value, list):
                  for item in value:
                      payloads.extend(_extract_invoke_api_payloads(item, depth + 1))
                  return payloads

              if isinstance(value, dict):
                  tool_call_name = value.get("tool_call_name")
                  tool_response = value.get("tool_response")
                  if tool_call_name == "invoke_api" and tool_response is not None:
                      parsed_tool_response, tool_ok = _try_load_json(tool_response)
                      payloads.append(parsed_tool_response if tool_ok else tool_response)

                  for key, item in value.items():
                      if key in {"tool_call_input", "llm_response", "usage"}:
                          continue
                      payloads.extend(_extract_invoke_api_payloads(item, depth + 1))

              return payloads


          def _is_chart_option(value: Any) -> bool:
              if not isinstance(value, dict):
                  return False
              keys = set(value.keys())
              if "series" in keys:
                  return True
              return len(keys & CHART_HINT_KEYS) >= 2


          def _extract_openai_like_content(payload: dict) -> Any:
              choices = payload.get("choices")
              if not isinstance(choices, list):
                  return None

              for choice in choices:
                  if not isinstance(choice, dict):
                      continue

                  message = choice.get("message")
                  if isinstance(message, dict):
                      content = message.get("content")
                      if isinstance(content, str) and content.strip():
                          return content
                      if isinstance(content, list):
                          parts = []
                          for item in content:
                              if not isinstance(item, dict):
                                  continue
                              text = item.get("text")
                              if isinstance(text, str) and text.strip():
                                  parts.append(text)
                              alt_content = item.get("content")
                              if isinstance(alt_content, str) and alt_content.strip():
                                  parts.append(alt_content)
                          if parts:
                              return "\n".join(parts)

                  text = choice.get("text")
                  if isinstance(text, str) and text.strip():
                      return text

              return None


          def _extract_markdown_table(text: str) -> str | None:
              blocks = re.findall(r"(?:^\|.*\|\s*$\n?)+", text, flags=re.M)
              separator_pattern = re.compile(r"^\|\s*:?-{3,}[\s\-|:]*\|\s*$")
              for block in blocks:
                  lines = [line.rstrip() for line in block.strip().splitlines() if line.strip()]
                  if len(lines) >= 2 and separator_pattern.match(lines[1]):
                      return "\n".join(lines)
              return None


          def _search_explicit_markdown_table(value: Any, depth: int = 0) -> str | None:
              if depth > 8 or value in (None, ""):
                  return None

              parsed, parsed_ok = _try_load_json(value)
              if parsed_ok and parsed is not value:
                  found = _search_explicit_markdown_table(parsed, depth + 1)
                  if found is not None:
                      return found
                  value = parsed

              if isinstance(value, str):
                  return _extract_markdown_table(value)

              if isinstance(value, list):
                  for item in value:
                      found = _search_explicit_markdown_table(item, depth + 1)
                      if found is not None:
                          return found
                  return None

              if isinstance(value, dict):
                  openai_like = _extract_openai_like_content(value)
                  if openai_like is not None:
                      found = _search_explicit_markdown_table(openai_like, depth + 1)
                      if found is not None:
                          return found

                  for key, item in value.items():
                      if key in {"tool_call_input", "usage"}:
                          continue
                      found = _search_explicit_markdown_table(item, depth + 1)
                      if found is not None:
                          return found

              return None


          def _search_display_plan(value: Any, depth: int = 0) -> dict[str, Any] | None:
              if depth > 8 or value in (None, ""):
                  return None

              parsed, parsed_ok = _try_load_json(value)
              if parsed_ok and parsed is not value:
                  found = _search_display_plan(parsed, depth + 1)
                  if found is not None:
                      return found
                  value = parsed

              if isinstance(value, str):
                  fenced = re.search(r"```(?:json)?\s*(.*?)\s*```", value, re.S)
                  if fenced:
                      parsed_inner, inner_ok = _try_load_json(fenced.group(1).strip())
                      if inner_ok:
                          return _search_display_plan(parsed_inner, depth + 1)
                  return None

              if isinstance(value, list):
                  for item in value:
                      found = _search_display_plan(item, depth + 1)
                      if found is not None:
                          return found
                  return None

              if isinstance(value, dict):
                  if isinstance(value.get("table_columns"), list) and isinstance(value.get("table_rows"), list):
                      return value

                  openai_like = _extract_openai_like_content(value)
                  if openai_like is not None:
                      found = _search_display_plan(openai_like, depth + 1)
                      if found is not None:
                          return found

                  for key in ["result", "output", "answer", "content", "message", "data", "payload", "body"]:
                      if key in value:
                          found = _search_display_plan(value[key], depth + 1)
                          if found is not None:
                              return found

              return None


          def _search_chart_candidate(value: Any, depth: int = 0) -> Any:
              if depth > 8 or value in (None, ""):
                  return None

              parsed, parsed_ok = _try_load_json(value)
              if parsed_ok and parsed is not value:
                  found = _search_chart_candidate(parsed, depth + 1)
                  if found is not None:
                      return found
                  value = parsed

              if _is_chart_option(value):
                  return value

              if isinstance(value, str):
                  text = value.strip()
                  if text.startswith("```echarts"):
                      return text

                  fenced = re.search(r"```(?:echarts|json)?\s*(.*?)\s*```", text, re.S)
                  if fenced:
                      inner = fenced.group(1).strip()
                      parsed_inner, inner_ok = _try_load_json(inner)
                      if inner_ok:
                          found = _search_chart_candidate(parsed_inner, depth + 1)
                          if found is not None:
                              return found
                      return f"```echarts\n{inner}\n```"
                  return None

              if isinstance(value, list):
                  for item in value:
                      found = _search_chart_candidate(item, depth + 1)
                      if found is not None:
                          return found
                  return None

              if isinstance(value, dict):
                  tool_call_name = value.get("tool_call_name")
                  tool_response = value.get("tool_response")
                  if tool_call_name == "invoke_api" and tool_response is not None:
                      found = _search_chart_candidate(tool_response, depth + 1)
                      if found is not None:
                          return found

                  for key in CHART_KEYS:
                      if key in value:
                          found = _search_chart_candidate(value[key], depth + 1)
                          if found is not None:
                              return found

                  openai_like = _extract_openai_like_content(value)
                  if openai_like is not None:
                      found = _search_chart_candidate(openai_like, depth + 1)
                      if found is not None:
                          return found

                  for item in value.values():
                      found = _search_chart_candidate(item, depth + 1)
                      if found is not None:
                          return found

              return None


          def _search_table_candidate(value: Any, depth: int = 0) -> Any:
              if depth > 8 or value in (None, ""):
                  return None

              parsed, parsed_ok = _try_load_json(value)
              if parsed_ok and parsed is not value:
                  found = _search_table_candidate(parsed, depth + 1)
                  if found is not None:
                      return found
                  value = parsed

              if isinstance(value, str):
                  table = _extract_markdown_table(value)
                  if table:
                      return table

                  fenced = re.search(r"```(?:markdown|md|json)?\s*(.*?)\s*```", value, re.S)
                  if fenced:
                      inner = fenced.group(1).strip()
                      table = _extract_markdown_table(inner)
                      if table:
                          return table
                  return None

              if isinstance(value, list):
                  for item in value:
                      found = _search_table_candidate(item, depth + 1)
                      if found is not None:
                          return found
                  if _looks_like_business_rows(value):
                      return [
                          row for row in value
                          if isinstance(row, dict)
                          and not _looks_like_log_row(row)
                          and not _looks_like_api_catalog_row(row)
                      ]
                  return None

              if isinstance(value, dict):
                  tool_call_name = value.get("tool_call_name")
                  tool_response = value.get("tool_response")
                  if tool_call_name == "invoke_api" and tool_response is not None:
                      found = _search_table_candidate(tool_response, depth + 1)
                      if found is not None:
                          return found

                  for key in TABLE_KEYS:
                      if key in value:
                          found = _search_table_candidate(value[key], depth + 1)
                          if found is not None:
                              return found

                  for key in ROW_KEYS:
                      if key in value:
                          found = _search_table_candidate(value[key], depth + 1)
                          if found is not None:
                              return found

                  openai_like = _extract_openai_like_content(value)
                  if openai_like is not None:
                      found = _search_table_candidate(openai_like, depth + 1)
                      if found is not None:
                          return found

                  for key, item in value.items():
                      if key in NOISE_CONTAINER_KEYS:
                          continue
                      found = _search_table_candidate(item, depth + 1)
                      if found is not None:
                          return found

              return None


          def _search_rows_candidate(value: Any, depth: int = 0) -> list[dict[str, Any]] | None:
              if depth > 8 or value in (None, ""):
                  return None

              parsed, parsed_ok = _try_load_json(value)
              if parsed_ok and parsed is not value:
                  found = _search_rows_candidate(parsed, depth + 1)
                  if found is not None:
                      return found
                  value = parsed

              if isinstance(value, list):
                  if _looks_like_business_rows(value):
                      rows = [
                          row for row in value
                          if isinstance(row, dict)
                          and not _looks_like_log_row(row)
                          and not _looks_like_api_catalog_row(row)
                      ]
                      if rows:
                          return rows

                  for item in value:
                      found = _search_rows_candidate(item, depth + 1)
                      if found is not None:
                          return found
                  return None

              if isinstance(value, dict):
                  tool_call_name = value.get("tool_call_name")
                  tool_response = value.get("tool_response")
                  if tool_call_name == "invoke_api" and tool_response is not None:
                      found = _search_rows_candidate(tool_response, depth + 1)
                      if found is not None:
                          return found

                  for key in ROW_KEYS:
                      if key in value:
                          found = _search_rows_candidate(value[key], depth + 1)
                          if found is not None:
                              return found

                  for key, item in value.items():
                      if key in NOISE_CONTAINER_KEYS:
                          continue
                      found = _search_rows_candidate(item, depth + 1)
                      if found is not None:
                          return found

              return None


          def _format_cell(value: Any) -> str:
              if value is None:
                  return ""
              if isinstance(value, bool):
                  return "true" if value else "false"
              text = str(value).replace("\r", " ").replace("\n", " ")
              return text.replace("|", "\\|").strip()


          def _translate_status_value(value: Any) -> Any:
              if value is None:
                  return value

              text = str(value).strip()
              if not text:
                  return value

              normalized = text.lower().replace(" ", "_")
              if normalized in STATUS_VALUE_LABELS:
                  return STATUS_VALUE_LABELS[normalized]

              if text in STATUS_VALUE_LABELS:
                  return STATUS_VALUE_LABELS[text]

              return value


          def _looks_like_project_rows(rows: list[dict[str, Any]]) -> bool:
              project_key_hits = 0
              for key in PROJECT_DOMAIN_KEYS:
                  if any(key in row and _is_scalar(row.get(key)) for row in rows):
                      project_key_hits += 1
              return project_key_hits >= 2


          def _should_translate_status(column: str, rows: list[dict[str, Any]]) -> bool:
              if column in PROJECT_STATUS_COLUMNS:
                  return True
              if column == "status" and _looks_like_project_rows(rows):
                  return True
              return False


          def _format_cell_for_column(column: str, value: Any, rows: list[dict[str, Any]]) -> str:
              if _should_translate_status(column, rows):
                  value = _translate_status_value(value)
              return _format_cell(value)


          def _has_chinese(text: str) -> bool:
              return bool(re.search(r"[\u4e00-\u9fff]", text))


          def _split_field_key(key: str) -> list[str]:
              spaced = re.sub(r"([A-Z]+)([A-Z][a-z])", r"\1 \2", key)
              spaced = re.sub(r"([a-z0-9])([A-Z])", r"\1 \2", spaced)
              parts = [part for part in re.split(r"[_\-\s]+", spaced) if part]
              if len(parts) > 1:
                  return parts

              compact = re.sub(r"[^A-Za-z0-9]+", "", key).lower()
              if not compact or compact == key.lower() and compact not in TOKEN_LABELS:
                  tokens: list[str] = []
                  remaining = compact
                  token_candidates = sorted(TOKEN_LABELS.keys(), key=len, reverse=True)
                  while remaining:
                      matched = next((token for token in token_candidates if remaining.startswith(token)), None)
                      if not matched:
                          return parts
                      tokens.append(matched)
                      remaining = remaining[len(matched):]
                  if len(tokens) > 1:
                      return tokens

              return parts


          def _label_column(key: str) -> str:
              if key in COLUMN_LABELS:
                  return COLUMN_LABELS[key]

              if _has_chinese(key):
                  return key

              parts = _split_field_key(key)
              if not parts:
                  return key

              translated_parts = []
              lowered_parts = [part.lower() for part in parts]
              for index, part in enumerate(parts):
                  lowered = lowered_parts[index]
                  translated = TOKEN_LABELS.get(lowered)
                  if lowered == "number" and index > 0 and lowered_parts[index - 1] in {"employee", "user", "member", "project", "contract", "customer", "product"}:
                      translated = "编号"
                  if lowered == "number" and index > 0 and lowered_parts[index - 1] in {"phone", "mobile", "telephone"}:
                      translated = "号码"
                  if lowered == "id" and index > 0 and lowered_parts[index - 1] in {"tenant", "dept", "department", "user", "project", "contract", "customer", "product", "company", "organization", "org"}:
                      translated = "ID"
                  if not translated:
                      return key
                  translated_parts.append(translated)

              return "".join(translated_parts)


          def _normalize_label(key: str, label: str) -> str:
              if label and _has_chinese(label):
                  return label
              inferred = _label_column(key)
              if inferred and inferred != key:
                  return inferred
              return label or key


          def _score_column(key: str) -> int:
              lowered = key.lower()
              score = 0

              high_priority_exact = {
                  "name", "username", "userName", "nickName", "realName", "fullName",
                  "loginName", "deptName", "departmentName", "roleName", "status",
                  "statusName", "email", "phone", "mobile", "telephone",
                  "employeeNumber", "jobNumber", "code", "projectCode", "projectName",
              }
              if key in high_priority_exact or lowered in {item.lower() for item in high_priority_exact}:
                  score += 120

              if "name" in lowered:
                  score += 90
              if any(token in lowered for token in ["email", "phone", "mobile", "telephone"]):
                  score += 80
              if any(token in lowered for token in ["dept", "department", "role", "title", "position"]):
                  score += 70
              if any(token in lowered for token in ["status", "state", "enabled", "disabled"]):
                  score += 65
              if any(token in lowered for token in ["login", "date", "time", "created", "updated"]):
                  score += 55
              if any(token in lowered for token in ["code", "number", "num", "no"]):
                  score += 45
              if lowered.endswith("id"):
                  score -= 20
              if any(token in lowered for token in ["tenantid", "defaulttenantid", "deptid", "userid", "roleid", "parentid"]):
                  score -= 45
              if any(token in lowered for token in ["flag", "avatar", "icon", "logo", "deleted", "delete", "delflag"]):
                  score -= 60

              return score


          def _collect_columns(rows: list[dict[str, Any]], max_columns: int = 10) -> list[str]:
              available_scalar_keys: set[str] = set()
              first_seen_order: dict[str, int] = {}
              for row in rows:
                  for key, value in row.items():
                      if _is_scalar(value):
                          available_scalar_keys.add(key)
                          if key not in first_seen_order:
                              first_seen_order[key] = len(first_seen_order)

              if _looks_like_project_rows(rows):
                  preferred_columns: list[str] = []
                  for group in PREFERRED_COLUMN_GROUPS:
                      for candidate in group:
                          if candidate in available_scalar_keys:
                              preferred_columns.append(candidate)
                              break

                  if preferred_columns:
                      return preferred_columns

              scored_columns = sorted(
                  available_scalar_keys,
                  key=lambda key: (-_score_column(key), first_seen_order.get(key, 9999), key.lower()),
              )
              return scored_columns[:max_columns]


          def _normalize_plan_columns(columns: Any, rows: Any, max_columns: int = 12) -> list[dict[str, str]]:
              normalized: list[dict[str, str]] = []

              if isinstance(columns, list):
                  for column in columns:
                      key = ""
                      label = ""
                      if isinstance(column, str):
                          key = column
                          label = column
                      elif isinstance(column, dict):
                          key_value = column.get("key") or column.get("field") or column.get("dataIndex") or column.get("name")
                          label_value = column.get("label") or column.get("title") or column.get("header") or column.get("display_name")
                          key = str(key_value).strip() if key_value is not None else ""
                          label = str(label_value).strip() if label_value is not None else ""

                      if not key:
                          continue
                      normalized.append({
                          "key": key,
                          "label": _normalize_label(key, label),
                      })

              if not normalized and isinstance(rows, list):
                  seen: set[str] = set()
                  for row in rows:
                      if not isinstance(row, dict):
                          continue
                      for key, value in row.items():
                          if key in seen or not _is_scalar(value):
                              continue
                          seen.add(key)
                          normalized.append({
                              "key": key,
                              "label": _label_column(key),
                          })
                          if len(normalized) >= max_columns:
                              return normalized

              return normalized[:max_columns]


          def _get_plan_rows(plan: dict[str, Any]) -> list[Any]:
              rows = plan.get("table_rows")
              if rows is None:
                  rows = plan.get("rows")
              return rows if isinstance(rows, list) else []


          def _get_plan_chart(plan: dict[str, Any]) -> Any:
              for key in ["chart_option", "option", "echarts", "chart"]:
                  value = plan.get(key)
                  if value not in (None, "", {}, []):
                      return value
              return None


          def _get_plan_chart_dimension(plan: dict[str, Any]) -> str | None:
              for key in ["chart_dimension_key", "dimension_key", "group_by_key", "group_key"]:
                  value = plan.get(key)
                  if isinstance(value, str):
                      normalized = value.strip()
                      if normalized:
                          return normalized
                  elif isinstance(value, dict):
                      candidate = value.get("key") or value.get("field") or value.get("value")
                      if isinstance(candidate, str):
                          normalized = candidate.strip()
                          if normalized:
                              return normalized
              return None


          def _get_plan_chart_dimension_label(plan: dict[str, Any]) -> str | None:
              for key in ["chart_dimension_label", "dimension_label", "group_by_label", "group_label"]:
                  value = plan.get(key)
                  if isinstance(value, str):
                      normalized = value.strip()
                      if normalized:
                          return normalized
                  elif isinstance(value, dict):
                      candidate = value.get("label") or value.get("title") or value.get("name")
                      if isinstance(candidate, str):
                          normalized = candidate.strip()
                          if normalized:
                              return normalized
              return None


          def _build_display_plan_table(plan: dict[str, Any]) -> str:
              markdown = plan.get("table_markdown") or plan.get("markdown_table")
              if isinstance(markdown, str) and _extract_markdown_table(markdown):
                  return _extract_markdown_table(markdown) or ""

              rows = _get_plan_rows(plan)
              columns = _normalize_plan_columns(plan.get("table_columns") or plan.get("columns"), rows)
              if not rows or not columns:
                  return markdown.strip() if isinstance(markdown, str) else ""

              header_labels = ["序号", *[column["label"] for column in columns]]
              header = "| " + " | ".join(_format_cell(label) for label in header_labels) + " |"
              separator = "| " + " | ".join(["---"] * len(header_labels)) + " |"
              body = []

              for index, row in enumerate(rows[:20]):
                  values = [_format_cell(index + 1)]
                  for column in columns:
                      key = column["key"]
                      if isinstance(row, dict):
                          values.append(_format_cell(row.get(key, "")))
                      elif isinstance(row, list):
                          column_index = columns.index(column)
                          values.append(_format_cell(row[column_index] if column_index < len(row) else ""))
                      else:
                          values.append(_format_cell(row))
                  body.append("| " + " | ".join(values) + " |")

              return "\n".join([header, separator, *body])


          def _build_table_markdown(value: Any) -> str:
              if isinstance(value, str):
                  return _extract_markdown_table(value) or value.strip()

              if isinstance(value, list):
                  rows = [row for row in value if isinstance(row, dict)]
                  if not rows:
                      return ""

                  columns = _collect_columns(rows)
                  if not columns:
                      return ""

                  header_labels = ["序号", *[_label_column(column) for column in columns]]
                  header = "| " + " | ".join(header_labels) + " |"
                  separator = "| " + " | ".join(["---"] * len(header_labels)) + " |"
                  body = [
                      "| " + " | ".join([
                          _format_cell(index + 1),
                          *[_format_cell_for_column(column, row.get(column), rows) for column in columns],
                      ]) + " |"
                      for index, row in enumerate(rows)
                  ]
                  return "\n".join([header, separator, *body])

              return ""


          def _build_chart_markdown(value: Any) -> dict[str, str]:
              if isinstance(value, str):
                  text = value.strip()
                  if text.startswith("```echarts"):
                      return {
                          "markdown": text,
                          "option_json": _strip_fence(text),
                      }

                  loaded, ok = _try_load_json(text)
                  if ok:
                      pretty = json.dumps(loaded, ensure_ascii=False, indent=2)
                      return {
                          "markdown": f"```echarts\n{pretty}\n```",
                          "option_json": json.dumps(loaded, ensure_ascii=False),
                      }

                  raise ValueError("string value is not valid echarts json")

              pretty = json.dumps(value, ensure_ascii=False, indent=2)
              return {
                  "markdown": f"```echarts\n{pretty}\n```",
                  "option_json": json.dumps(value, ensure_ascii=False),
              }


          def _infer_chart_preference(text: str) -> str:
              lowered = text.lower()
              if any(keyword in text for keyword in ["饼图", "占比", "占率", "环形图", "圆环图"]) or "pie" in lowered:
                  return "pie"
              if any(keyword in text for keyword in ["折线图", "趋势"]) or "line" in lowered:
                  return "line"
              if any(keyword in text for keyword in ["柱状图", "条形图"]) or "bar" in lowered:
                  return "bar"
              return "bar"


          def _should_generate_chart(query_text: str) -> bool:
              lowered = query_text.lower()
              return any(keyword in query_text for keyword in CHART_REQUEST_KEYWORDS) or any(
                  keyword in lowered for keyword in CHART_REQUEST_KEYWORDS if keyword.isascii()
              )


          def _match_text(text: str) -> str:
              return re.sub(r"[^0-9A-Za-z\u4e00-\u9fff]+", "", text).lower()


          def _row_value(row: Any, columns: list[dict[str, str]], column: dict[str, str]) -> Any:
              if isinstance(row, dict):
                  return row.get(column["key"])
              if isinstance(row, list):
                  column_index = columns.index(column)
                  return row[column_index] if column_index < len(row) else None
              return None


          def _find_chart_dimension(columns: list[dict[str, str]], rows: list[Any], query_text: str) -> dict[str, str] | None:
              if not columns:
                  return None

              query_match = _match_text(query_text)
              scored: list[tuple[int, int, dict[str, str]]] = []
              for index, column in enumerate(columns):
                  key = column["key"]
                  label = column["label"]
                  label_match = _match_text(label)
                  key_match = _match_text(key)
                  score = 0

                  if label_match and label_match in query_match:
                      score += 100
                  if key_match and key_match in query_match:
                      score += 80

                  chinese_parts = re.findall(r"[\u4e00-\u9fff]{2,}", label)
                  if any(part in query_text for part in chinese_parts):
                      score += 50

                  if any(token in label_match or token in key_match for token in ["状态", "status", "类型", "type", "分类", "category", "部门", "dept", "department"]):
                      score += 70
                  if any(token in label_match or token in key_match for token in ["负责人", "经理", "manager", "owner", "区域", "region", "area"]):
                      score += 45

                  non_empty_values = [
                      str(_row_value(row, columns, column)).strip()
                      for row in rows
                      if _row_value(row, columns, column) not in (None, "")
                  ]
                  unique_count = len(set(non_empty_values))
                  if unique_count >= 2:
                      score += 20
                  if 2 <= unique_count <= 20:
                      score += 20
                  if unique_count <= 1:
                      score -= 60
                  if unique_count == len(non_empty_values) and len(non_empty_values) > 5:
                      score -= 30
                  if any(token in key_match for token in ["id", "code", "phone", "mobile", "email", "time", "date", "ip"]):
                      score -= 40
                  if any(token in label_match for token in ["编码", "编号", "名称", "日期", "时间"]):
                      score -= 40
                  if any(token in label_match or token in key_match for token in ["状态", "status", "state"]) and not any(
                      token in query_match for token in ["状态", "status", "state"]
                  ):
                      score -= 45

                  if score > 0:
                      scored.append((score, -index, column))

              if scored:
                  scored.sort(reverse=True, key=lambda item: (item[0], item[1]))
                  return scored[0][2]

              for column in columns:
                  values = [
                      str(_row_value(row, columns, column)).strip()
                      for row in rows
                      if _row_value(row, columns, column) not in (None, "")
                  ]
                  unique_count = len(set(values))
                  if 2 <= unique_count <= 20:
                      return column

              return columns[0]


          def _query_requests_grouping(query_text: str) -> bool:
              lowered = query_text.lower()
              return any(keyword in query_text for keyword in ["按", "根据", "按照", "区分", "分类", "统计", "切换"]) or any(
                  keyword in lowered for keyword in ["group by", "group", "count", "chart"]
              )


          def _build_group_count_chart_option(plan: dict[str, Any], query_text: str) -> dict[str, Any] | None:
              rows = _get_plan_rows(plan)
              columns = _normalize_plan_columns(plan.get("table_columns") or plan.get("columns"), rows)
              if not rows or not columns:
                  return None

              dimension = _find_chart_dimension(columns, rows, query_text)
              if dimension is None:
                  return None

              counts: dict[str, int] = {}
              for row in rows:
                  value = _row_value(row, columns, dimension)
                  if isinstance(row, dict):
                      text = _format_cell_for_column(dimension["key"], value, [item for item in rows if isinstance(item, dict)])
                  else:
                      text = _format_cell(value)
                  if not text:
                      continue
                  counts[text] = counts.get(text, 0) + 1

              if not counts:
                  return None

              items = sorted(counts.items(), key=lambda item: (-item[1], item[0]))
              categories = [item[0] for item in items]
              values = [item[1] for item in items]
              chart_type = _infer_chart_preference(query_text)
              title_text = f"按{dimension['label']}统计"

              if chart_type == "pie":
                  return {
                      "title": {"text": title_text, "left": "center"},
                      "tooltip": {"trigger": "item"},
                      "legend": {"bottom": 0},
                      "series": [
                          {
                              "name": "数量",
                              "type": "pie",
                              "radius": ["42%", "70%"],
                              "data": [
                                  {"name": category, "value": counts[category]}
                                  for category in categories
                              ],
                          }
                      ],
                  }

              return {
                  "title": {"text": title_text, "left": "center"},
                  "tooltip": {"trigger": "axis"},
                  "grid": {"left": 48, "right": 32, "top": 72, "bottom": 48, "containLabel": True},
                  "xAxis": {"type": "category", "data": categories, "axisLabel": {"interval": 0}},
                  "yAxis": {"type": "value", "name": "数量", "minInterval": 1},
                  "series": [
                      {
                          "name": "数量",
                          "type": chart_type if chart_type in {"bar", "line"} else "bar",
                          "data": values,
                          "label": {"show": True, "position": "top"},
                      }
                  ],
              }


          def _build_llm_chart_option(plan: dict[str, Any], query_text: str) -> dict[str, Any] | None:
              rows_candidate = _get_plan_rows(plan)
              if not rows_candidate:
                  return None

              rows = [row for row in rows_candidate if isinstance(row, dict)]
              if not rows:
                  return None

              dimension_key = _get_plan_chart_dimension(plan)
              if not dimension_key:
                  return None

              columns = _normalize_plan_columns(plan.get("table_columns") or plan.get("columns"), rows)
              if not columns:
                  return None

              dimension = next(
                  (
                      column
                      for column in columns
                      if column["key"] == dimension_key or column["key"].lower() == dimension_key.lower()
                  ),
                  None,
              )
              if dimension is None:
                  return None

              counts: dict[str, int] = {}
              for row in rows:
                  value = _row_value(row, columns, dimension)
                  if _should_translate_status(dimension["key"], rows):
                      value = _translate_status_value(value)
                  text = str(value).strip() if value is not None else ""
                  if not text:
                      continue
                  counts[text] = counts.get(text, 0) + 1

              if not counts:
                  return None

              items = sorted(counts.items(), key=lambda item: (-item[1], item[0]))
              categories = [item[0] for item in items]
              values = [item[1] for item in items]
              chart_type = _infer_chart_preference(query_text)
              dimension_label = _get_plan_chart_dimension_label(plan) or dimension["label"]
              title_text = f"按{dimension_label}统计"

              if chart_type == "pie":
                  return {
                      "title": {"text": title_text, "left": "center"},
                      "tooltip": {"trigger": "item"},
                      "legend": {"bottom": 0},
                      "series": [
                          {
                              "name": "数量",
                              "type": "pie",
                              "radius": ["42%", "70%"],
                              "data": [
                                  {"name": category, "value": counts[category]}
                                  for category in categories
                              ],
                          }
                      ],
                  }

              return {
                  "title": {"text": title_text, "left": "center"},
                  "tooltip": {"trigger": "axis"},
                  "grid": {"left": 48, "right": 32, "top": 72, "bottom": 48, "containLabel": True},
                  "xAxis": {"type": "category", "data": categories, "axisLabel": {"interval": 0}},
                  "yAxis": {"type": "value", "name": "数量", "minInterval": 1},
                  "series": [
                      {
                          "name": "数量",
                          "type": chart_type if chart_type in {"bar", "line"} else "bar",
                          "data": values,
                          "label": {"show": True, "position": "top"},
                      }
                  ],
              }


          def _build_default_chart_option(rows_candidate: Any, query_text: str) -> dict[str, Any] | None:
              if not isinstance(rows_candidate, list):
                  return None

              rows = [row for row in rows_candidate if isinstance(row, dict)]
              if not rows:
                  return None

              columns = [
                  {"key": column, "label": _label_column(column)}
                  for column in _collect_columns(rows, max_columns=12)
              ]
              if not columns:
                  return None

              return _build_group_count_chart_option(
                  {
                      "table_columns": columns,
                      "table_rows": rows,
                  },
                  query_text,
              )


          def _build_status_chart_option(rows: list[dict[str, Any]], query_text: str = "") -> dict[str, Any] | None:
              if not _should_generate_chart(query_text):
                  return None

              status_column = None
              for candidate in ["projectStatusName", "projectStatus", "status", "statusName"]:
                  if any(candidate in row for row in rows):
                      if candidate == "status" and not _looks_like_project_rows(rows):
                          sample_values = {
                              str(row.get(candidate)).strip()
                              for row in rows
                              if row.get(candidate) not in (None, "")
                          }
                          if sample_values and sample_values.issubset({"0", "1"}):
                              continue
                      status_column = candidate
                      break

              if not status_column:
                  return None

              status_counts: dict[str, int] = {}
              for row in rows:
                  status_value = row.get(status_column)
                  if _should_translate_status(status_column, rows):
                      status_value = _translate_status_value(status_value)
                  status_text = str(status_value).strip() if status_value is not None else ""
                  if not status_text:
                      continue
                  status_counts[status_text] = status_counts.get(status_text, 0) + 1

              if not status_counts:
                  return None

              categories = list(status_counts.keys())
              values = [status_counts[category] for category in categories]
              chart_type = _infer_chart_preference(query_text)
              metric_label = _label_column(status_column)
              title_text = f"{metric_label}分布"

              common_toolbox = {
                  "show": True,
                  "right": 16,
                  "feature": {
                      "magicType": {
                          "show": chart_type != "pie",
                          "type": ["bar", "line", "stack", "tiled"],
                          "title": {
                              "bar": "切换为柱状图",
                              "line": "切换为折线图",
                              "stack": "切换为堆叠",
                              "tiled": "切换为平铺",
                          },
                      },
                      "restore": {
                          "show": True,
                          "title": "还原",
                      },
                      "saveAsImage": {
                          "show": True,
                          "title": "保存为图片",
                      },
                  },
              }

              if chart_type == "pie":
                  return {
                      "title": {
                          "text": title_text,
                          "left": "center",
                      },
                      "tooltip": {
                          "trigger": "item",
                      },
                      "legend": {
                          "bottom": 0,
                      },
                      "toolbox": common_toolbox,
                      "series": [
                          {
                              "name": metric_label,
                              "type": "pie",
                              "radius": ["42%", "70%"],
                              "center": ["50%", "54%"],
                              "avoidLabelOverlap": False,
                              "itemStyle": {
                                  "borderRadius": 8,
                                  "borderColor": "#fff",
                                  "borderWidth": 2,
                              },
                              "label": {
                                  "show": True,
                                  "formatter": "{b}: {c}",
                              },
                              "data": [
                                  {"name": category, "value": status_counts[category]}
                                  for category in categories
                              ],
                          }
                      ],
                  }

              return {
                  "title": {
                      "text": title_text,
                      "left": "center",
                  },
                  "tooltip": {
                      "trigger": "axis",
                      "axisPointer": {
                          "type": "shadow",
                      },
                  },
                  "toolbox": common_toolbox,
                  "grid": {
                      "left": 48,
                      "right": 32,
                      "top": 72,
                      "bottom": 48,
                      "containLabel": True,
                  },
                  "xAxis": {
                      "type": "category",
                      "data": categories,
                      "axisLabel": {
                          "interval": 0,
                      },
                  },
                  "yAxis": {
                      "type": "value",
                      "name": "数量",
                      "minInterval": 1,
                  },
                  "series": [
                      {
                          "name": "数量",
                          "type": chart_type if chart_type in {"bar", "line"} else "bar",
                          "data": values,
                          "universalTransition": True,
                          "itemStyle": {
                              "borderRadius": [6, 6, 0, 0],
                          },
                          "label": {
                              "show": True,
                              "position": "top",
                          },
                      }
                  ],
              }


          def _is_empty_value(value: Any) -> bool:
              return value is None or value == "" or value == [] or value == {}


          def main(text: str, agent_json: Any = None, query: str = "") -> dict:
              query_text = query or text
              payload = text
              if not _is_empty_value(agent_json):
                  payload = agent_json
              else:
                  try:
                      parsed, ok = _try_load_json(text)
                      if ok:
                          payload = parsed
                  except Exception:
                      payload = text

              display_plan = _search_display_plan(payload)
              if display_plan is None and payload is not text:
                  display_plan = _search_display_plan(text)

              if display_plan is not None:
                  table_markdown = _build_display_plan_table(display_plan)
                  chart_candidate = _get_plan_chart(display_plan)
                  if chart_candidate is None:
                      chart_candidate = _build_llm_chart_option(display_plan, query_text)
                  if chart_candidate is None:
                      chart_candidate = _build_group_count_chart_option(display_plan, query_text)
                  chart_result = (
                      _build_chart_markdown(chart_candidate)
                      if chart_candidate is not None
                      else {"markdown": "", "option_json": ""}
                  )
                  parts = [part for part in [table_markdown.strip(), chart_result["markdown"].strip()] if part]
                  return {
                      "markdown": "\n\n".join(parts),
                      "option_json": chart_result["option_json"],
                  }

              explicit_table_candidate = _search_explicit_markdown_table(payload)
              if explicit_table_candidate is None and payload is not text:
                  explicit_table_candidate = _search_explicit_markdown_table(text)

              chart_candidate = None
              chart_candidate = _search_chart_candidate(payload)
              if chart_candidate is None and payload is not text:
                  chart_candidate = _search_chart_candidate(text)

              table_candidate = None
              rows_candidate = None

              invoke_api_payloads = _extract_invoke_api_payloads(payload)
              if not invoke_api_payloads and payload is not text:
                  invoke_api_payloads = _extract_invoke_api_payloads(text)

              for invoke_payload in invoke_api_payloads:
                  if rows_candidate is None:
                      rows_candidate = _search_rows_candidate(invoke_payload)
                  if table_candidate is None and explicit_table_candidate is None:
                      table_candidate = _search_table_candidate(invoke_payload)
                  if chart_candidate is None:
                      chart_candidate = _search_chart_candidate(invoke_payload)
                  if rows_candidate is not None and table_candidate is not None and chart_candidate is not None:
                      break

              if table_candidate is None and explicit_table_candidate is None:
                  table_candidate = _search_table_candidate(payload)
              if table_candidate is None and explicit_table_candidate is None and payload is not text:
                  table_candidate = _search_table_candidate(text)

              if rows_candidate is None:
                  rows_candidate = _search_rows_candidate(payload)
              if rows_candidate is None and payload is not text:
                  rows_candidate = _search_rows_candidate(text)

              final_table_candidate = explicit_table_candidate if explicit_table_candidate is not None else table_candidate

              table_markdown = _build_table_markdown(final_table_candidate) if final_table_candidate is not None else ""
              if chart_candidate is None:
                  chart_candidate = _build_default_chart_option(rows_candidate, query_text)
              if chart_candidate is None:
                  chart_candidate = _build_default_chart_option(final_table_candidate, query_text)
              chart_result = (
                  _build_chart_markdown(chart_candidate)
                  if chart_candidate is not None
                  else {"markdown": "", "option_json": ""}
              )

              parts = [part for part in [table_markdown.strip(), chart_result["markdown"].strip()] if part]
              return {
                  "markdown": "\n\n".join(parts),
                  "option_json": chart_result["option_json"],
              }
