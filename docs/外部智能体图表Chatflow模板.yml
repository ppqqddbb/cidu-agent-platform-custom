    - data:
        isInIteration: false
        isInLoop: false
        sourceType: code
        targetType: answer
      id: code-to-answer
      source: normalize_chart_response
      sourceHandle: source
      target: answer
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
